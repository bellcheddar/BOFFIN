name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain rather than tracking whatever the runner image defaults
  # to: a silent Xcode bump is a silent change to the compiler, the SDK and the
  # simulator set. Raise this deliberately, in its own commit.
  XCODE_VERSION: "26.0"

jobs:
  # Fast structural gates. These need no simulator, so they fail in under a
  # minute rather than after a full build.
  checks:
    name: Structure and formatting
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Enforce the module dependency rule
        run: ./Tools/check-module-graph.sh

      - name: Lint formatting
        run: swift format lint --recursive --parallel --strict App Packages

      - name: Assert the Xcode project is committed
        run: |
          # BOFFIN is a native Xcode project: BOFFIN.xcodeproj is the source of
          # truth and must be in the repository. A clone that cannot open the
          # project is a broken clone.
          test -f BOFFIN.xcodeproj/project.pbxproj \
            || { echo "BOFFIN.xcodeproj/project.pbxproj is missing from the repository."; exit 1; }
          git ls-files --error-unmatch BOFFIN.xcodeproj/project.pbxproj >/dev/null \
            || { echo "BOFFIN.xcodeproj/project.pbxproj exists but is not tracked by git."; exit 1; }
          echo "Xcode project is committed."

      - name: Assert no per-user Xcode state is committed
        run: |
          # xcuserdata is per-developer noise (window positions, breakpoints,
          # last-selected scheme). Committing it produces conflicts on every
          # pull for changes nobody made deliberately.
          if git ls-files | grep -E 'xcuserdata/|\.xcuserstate'; then
            echo "Per-user Xcode state is committed. Add it to .gitignore and git rm --cached it."
            exit 1
          fi
          echo "No per-user Xcode state committed."

      - name: Assert no CDN references
        run: |
          # BOFFIN must work in aeroplane mode. A remote script or stylesheet
          # reference in the viewer resources breaks that premise silently: it
          # only fails when a user is offline, which is exactly when it
          # matters. Vendored assets only.
          #
          # The vendored Mol* build is excluded, and the exclusion is narrow on
          # purpose. It tripped this check on a COMMENT citing a SIGGRAPH paper
          # hosted on cdn2.unrealengine.com, which is not a reference to
          # anything at runtime. Excluding the whole file would also excuse a
          # real one, so the two files that are OURS are then checked for any
          # remote URL at all, and BoffinViewer has a test asserting the same
          # thing about the page it actually loads.
          if grep -rn -E 'https?://(cdn|unpkg|jsdelivr|cdnjs)' \
               --include='*.html' --include='*.js' --include='*.css' \
               --exclude='molstar.js' --exclude='molstar.css' \
               --exclude-dir='.build' \
               App Packages 2>/dev/null; then
            echo "CDN reference found. Vendor the asset instead (see build plan section 6.2)."
            exit 1
          fi
          if grep -n -E 'https?://' \
               Packages/BoffinViewer/Sources/BoffinViewer/Web/boffin-viewer.html \
               Packages/BoffinViewer/Sources/BoffinViewer/Web/boffin-bridge.js; then
            echo "The viewer page or bridge references a remote host. Everything it"
            echo "needs is vendored beside it."
            exit 1
          fi
          echo "No CDN references."

  # Package-level unit tests on the host. Faster than a simulator run and
  # covers everything that is not UI.
  packages:
    name: Package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Test each package
        run: |
          set -euo pipefail
          for package in Packages/*/ ; do
            name="$(basename "$package")"
            echo "::group::$name"
            (cd "$package" && swift test)
            echo "::endgroup::"
          done

  # Phase 0 acceptance: the app builds and runs on both iPhone and iPad
  # simulators, straight from a clean checkout with no generation step.
  app:
    name: App (${{ matrix.family }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Device *families*, not exact model names. Apple renames these every
        # cycle (this repo's own machine has "iPad Pro 13-inch (M5)" where the
        # first draft guessed M4), and a renamed device fails the build with an
        # unhelpful "unable to find a device matching the destination".
        # The resolve step below picks a real device of each family.
        family: ["iPhone", "iPad"]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Resolve a simulator for this family
        id: sim
        run: |
          set -euo pipefail
          # Print everything available first: when this job fails on a runner
          # image bump, the log should say what WAS available rather than only
          # what was asked for.
          echo "::group::Available simulators"
          xcrun simctl list devices available
          echo "::endgroup::"

          name="$(./Tools/pick-simulator.py "${{ matrix.family }}")"
          echo "Using: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Start the simulator from a known state
        run: |
          set -uo pipefail
          # The retries below were not enough. On 2026-08-26 the iPad job
          # failed BOTH attempts with "Failed to get launch progress" and
          # "Failed to get background assertion for target app", which is the
          # simulator unable to start the app rather than a test failing.
          #
          # Erasing first is what fixed the identical wedge on the development
          # machine, where it appeared as "Application failed preflight
          # checks" and recurred on roughly every other run. It costs about
          # fifteen seconds and removes a failure mode that reads, in the job
          # summary, exactly like a broken test.
          #
          # NEVER `killall CoreSimulatorService` to clear this: it unmounts the
          # runtime cryptex and only a reboot brings the runtimes back.
          name='${{ steps.sim.outputs.name }}'
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl erase "$name" >/dev/null 2>&1 || true
          xcrun simctl boot "$name" >/dev/null 2>&1 || true
          # Boot completion, not a fixed sleep: a simulator still starting its
          # services is the state that produces the failure above.
          xcrun simctl bootstatus "$name" -b || true
          xcrun simctl list devices | grep -A 1 "$name" | head -2 || true

      - name: Build and test
        run: |
          set -o pipefail
          # `-retry-tests-on-failure` is for the SIMULATOR, not for the tests.
          #
          # Four consecutive CI failures, four different symptoms, none
          # reproducible locally on freshly erased simulators: an iPad-only
          # layout failure (a real bug, fixed), a load that outran a 60 second
          # wait (real, fixed), a load that outran 180 seconds, and finally
          # "Timed out while requesting launch progress", which is the app
          # failing to start at all. The last two are the runner, not the app:
          # the same family as the "Application failed preflight checks" wedging
          # that hit this machine three times in one session.
          #
          # This does NOT paper over real failures. A deterministic failure
          # fails every attempt, and xcodebuild reports which tests needed a
          # retry, so a test that starts needing them is visible rather than
          # quietly passing. Two attempts, because a flake that survives one
          # retry is worth looking at.
          # ScreenshotCaptureTests is a tool, not a test: it drives the app to
          # the screens an App Store listing needs and attaches the images. It
          # asserts nothing about appearance, takes two and a half minutes, and
          # needs the Core ML models, which are gitignored and so absent here.
          # Run it deliberately with -only-testing when screenshots are wanted.
          xcodebuild test \
            -project BOFFIN.xcodeproj \
            -scheme BOFFIN \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath "TestResults-${{ matrix.family }}.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -skip-testing:BOFFINUITests/ScreenshotCaptureTests \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.family }}
          path: "TestResults-*.xcresult"
          if-no-files-found: ignore
