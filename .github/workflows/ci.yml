name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain rather than tracking whatever the runner image defaults
  # to: a silent Xcode bump is a silent change to the compiler, the SDK and the
  # simulator set. Raise this deliberately, in its own commit.
  XCODE_VERSION: "26.0"

jobs:
  # Fast structural gates. These need no Xcode and no simulator, so they fail
  # in under a minute rather than after a full build.
  checks:
    name: Structure and formatting
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Enforce the module dependency rule
        run: ./Tools/check-module-graph.sh

      - name: Lint formatting
        run: swift format lint --recursive --parallel --strict App Packages Project.swift Tuist.swift

      - name: Assert no committed Xcode project
        run: |
          # The .xcodeproj is generated by Tuist and must never be committed:
          # if one is present, someone has hand-edited project configuration.
          if git ls-files | grep -E '\.(xcodeproj|xcworkspace)/' ; then
            echo "A generated Xcode project is committed. Project changes go through Project.swift."
            exit 1
          fi
          echo "No committed Xcode project."

      - name: Assert no CDN references
        run: |
          # BOFFIN must work in aeroplane mode. A remote script or stylesheet
          # reference in the viewer resources breaks that premise silently:
          # it only fails when a user is offline, which is exactly when it
          # matters. Vendored assets only.
          if grep -rn -E 'https?://(cdn|unpkg|jsdelivr|cdnjs)' \
               --include='*.html' --include='*.js' --include='*.css' \
               App Packages 2>/dev/null; then
            echo "CDN reference found. Vendor the asset instead (see build plan section 6.2)."
            exit 1
          fi
          echo "No CDN references."

  # Package-level unit tests on the host. Faster than a simulator run and
  # covers everything that is not UI.
  packages:
    name: Package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Test each package
        run: |
          set -euo pipefail
          for package in Packages/*/ ; do
            name="$(basename "$package")"
            echo "::group::$name"
            (cd "$package" && swift test)
            echo "::endgroup::"
          done

  # Phase 0 acceptance: the app builds and runs on both iPhone and iPad
  # simulators, and `tuist generate` is reproducible from a clean checkout.
  app:
    name: App (${{ matrix.simulator }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        simulator:
          - "iPhone 17 Pro"
          - "iPad Pro 13-inch (M4)"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Install Tuist
        run: |
          brew tap tuist/tuist
          brew install --formula tuist

      - name: Generate the project
        run: tuist generate --no-open

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace BOFFIN.xcworkspace \
            -scheme BOFFIN \
            -destination "platform=iOS Simulator,name=${{ matrix.simulator }}" \
            -resultBundlePath "TestResults-${{ matrix.simulator }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.simulator }}
          path: "TestResults-*.xcresult"
          if-no-files-found: ignore
