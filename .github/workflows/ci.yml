name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain rather than tracking whatever the runner image defaults
  # to: a silent Xcode bump is a silent change to the compiler, the SDK and the
  # simulator set. Raise this deliberately, in its own commit.
  XCODE_VERSION: "26.0"

jobs:
  # Fast structural gates. These need no simulator, so they fail in under a
  # minute rather than after a full build.
  checks:
    name: Structure and formatting
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Enforce the module dependency rule
        run: ./Tools/check-module-graph.sh

      - name: Lint formatting
        run: swift format lint --recursive --parallel --strict App Packages

      - name: Assert the Xcode project is committed
        run: |
          # BOFFIN is a native Xcode project: BOFFIN.xcodeproj is the source of
          # truth and must be in the repository. A clone that cannot open the
          # project is a broken clone.
          test -f BOFFIN.xcodeproj/project.pbxproj \
            || { echo "BOFFIN.xcodeproj/project.pbxproj is missing from the repository."; exit 1; }
          git ls-files --error-unmatch BOFFIN.xcodeproj/project.pbxproj >/dev/null \
            || { echo "BOFFIN.xcodeproj/project.pbxproj exists but is not tracked by git."; exit 1; }
          echo "Xcode project is committed."

      - name: Assert no per-user Xcode state is committed
        run: |
          # xcuserdata is per-developer noise (window positions, breakpoints,
          # last-selected scheme). Committing it produces conflicts on every
          # pull for changes nobody made deliberately.
          if git ls-files | grep -E 'xcuserdata/|\.xcuserstate'; then
            echo "Per-user Xcode state is committed. Add it to .gitignore and git rm --cached it."
            exit 1
          fi
          echo "No per-user Xcode state committed."

      - name: Assert no CDN references
        run: |
          # BOFFIN must work in aeroplane mode. A remote script or stylesheet
          # reference in the viewer resources breaks that premise silently: it
          # only fails when a user is offline, which is exactly when it
          # matters. Vendored assets only.
          if grep -rn -E 'https?://(cdn|unpkg|jsdelivr|cdnjs)' \
               --include='*.html' --include='*.js' --include='*.css' \
               App Packages 2>/dev/null; then
            echo "CDN reference found. Vendor the asset instead (see build plan section 6.2)."
            exit 1
          fi
          echo "No CDN references."

  # Package-level unit tests on the host. Faster than a simulator run and
  # covers everything that is not UI.
  packages:
    name: Package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Test each package
        run: |
          set -euo pipefail
          for package in Packages/*/ ; do
            name="$(basename "$package")"
            echo "::group::$name"
            (cd "$package" && swift test)
            echo "::endgroup::"
          done

  # Phase 0 acceptance: the app builds and runs on both iPhone and iPad
  # simulators, straight from a clean checkout with no generation step.
  app:
    name: App (${{ matrix.simulator }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        simulator:
          - "iPhone 17 Pro"
          - "iPad Pro 13-inch (M4)"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project BOFFIN.xcodeproj \
            -scheme BOFFIN \
            -destination "platform=iOS Simulator,name=${{ matrix.simulator }}" \
            -resultBundlePath "TestResults-${{ matrix.simulator }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.simulator }}
          path: "TestResults-*.xcresult"
          if-no-files-found: ignore
