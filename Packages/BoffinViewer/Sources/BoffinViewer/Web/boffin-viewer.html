<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="molstar.css" />
    <style>
      /* The page IS the viewer. No chrome, no scrolling, no rubber banding:
         every pixel is structure and every gesture belongs to Mol*. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      #viewer { position: absolute; inset: 0; }
      body { background: #000; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script src="molstar.js"></script>
    <script src="boffin-bridge.js"></script>
  </body>
</html>
